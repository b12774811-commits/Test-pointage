<style>
  :root{
    --paper:#F6F1E4;
    --card:#FFFFFF;
    --ink:#1E2A44;
    --ink-soft:#5B6478;
    --line:#E3DAC3;
    --gold:#A5732A;
    --gold-bg:#F1E1BE;
    --stamp:#7C2D2D;
    --green:#1E8449;
    /* alias conservé pour compatibilité avec le script existant */
    --amber:var(--gold);
    --amber-bg:var(--gold-bg);
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Public Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,.serif{font-family:'Fraunces',serif;}
  ::selection{background:var(--gold-bg);color:var(--ink);}
  :focus-visible{outline:2px solid var(--gold);outline-offset:2px;}

  .spine{position:fixed;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,var(--gold),var(--stamp) 50%,var(--gold));z-index:30;}

  .announce-ribbon{background:var(--ink);overflow:hidden;white-space:nowrap;position:sticky;top:0;z-index:9;display:none;}
  .announce-ribbon.visible{display:block;}
  .announce-track{display:inline-flex;padding-left:100%;animation:ribbon-scroll 22s linear infinite;}
  .announce-track span{display:inline-block;padding:0 40px;color:var(--gold-bg);font-size:12.5px;font-weight:600;letter-spacing:.02em;line-height:34px;}
  @keyframes ribbon-scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
  @media (prefers-reduced-motion: reduce){ .announce-track{animation:none;padding-left:16px;} }

  header{border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:0;z-index:10;box-shadow:0 1px 0 var(--gold-bg);}
  .header-inner{max-width:760px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px;}
  .brandrow{display:flex;align-items:center;gap:10px;}
  .emblem{width:34px;height:34px;flex:none;border-radius:50%;border:2px dashed var(--gold);display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:600;font-size:12px;color:var(--ink);background:var(--card);}
  .brand p:first-child{font-size:10.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-weight:600;margin:0;}
  .brand p.title{font-size:17px;margin:2px 0;font-weight:600;}
  .brand p.date{font-size:11.5px;color:var(--ink-soft);margin:0;text-transform:capitalize;}
  .tabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:3px;}
  .tabs button{border:none;background:transparent;padding:7px 13px;font-size:12px;font-weight:600;border-radius:8px;cursor:pointer;color:var(--ink-soft);font-family:'Public Sans',sans-serif;}
  .tabs button.active{background:var(--ink);color:#fff;}
  main{max-width:760px;margin:0 auto;padding:32px 20px 64px;}
  input,select{font-family:'Public Sans',sans-serif;font-size:13.5px;padding:11px 14px;border:1px solid var(--line);border-radius:8px;background:var(--card);width:100%;direction:ltr;text-align:left;unicode-bidi:plaintext;color:var(--ink);}
  textarea{direction:ltr;text-align:left;}
  input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-bg);}
  .center{text-align:center;margin-bottom:26px;}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:54px;height:54px;border-radius:50%;background:var(--card);border:2px dashed var(--gold);color:var(--ink);font-size:22px;margin-bottom:10px;}
  .dept-label{font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;color:var(--gold);font-weight:700;margin:20px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--line);}
  .member-btn{width:100%;display:flex;justify-content:space-between;align-items:center;padding:13px 15px;border-radius:9px;border:1px solid var(--line);background:var(--card);font-size:13.5px;text-align:left;cursor:pointer;margin-bottom:8px;transition:border-color .15s;}
  .member-btn:not(:disabled):hover{border-color:var(--gold);}
  .member-btn.done{background:var(--paper);border-style:dashed;border-color:var(--gold);color:var(--ink);}
  .member-btn:disabled{cursor:default;}
  .muted{color:var(--ink-soft);font-size:12px;}
  .row{display:flex;gap:8px;}
  .btn-dark{background:var(--ink);color:#fff;border:none;padding:0 18px;height:38px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Public Sans',sans-serif;}
  .btn-green{background:var(--green);color:#fff;border:none;padding:9px 15px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-outline{background:var(--card);border:1px solid var(--gold);color:var(--gold);padding:9px 15px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;}
  .btn-green:disabled,.btn-outline:disabled{opacity:.4;cursor:default;}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:24px;}
  .stat{background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:8px;padding:14px;}
  .stat .n{font-size:23px;font-weight:600;font-family:'Fraunces',serif;}
  .stat .l{font-size:10.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:2px;}
  table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;font-size:13px;}
  th{background:var(--paper);text-align:left;padding:9px 12px;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);font-weight:600;border-bottom:1px solid var(--line);}
  td{padding:10px 12px;border-top:1px solid var(--line);}
  tbody tr:hover{background:var(--paper);}
  .link{color:var(--stamp);font-size:12px;text-decoration:underline;background:none;border:none;cursor:pointer;font-family:'Public Sans',sans-serif;}
  .toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;z-index:50;display:none;box-shadow:0 4px 14px rgba(0,0,0,.2);}
  @media (prefers-reduced-motion: reduce){ *{transition:none !important;animation:none !important;} }
</style>

  <div style="background:var(--card);border-radius:14px;padding:22px;max-width:360px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.25);">
    <p id="editModalLabel" class="serif" style="font-size:16px;margin:0 0 4px;">Champ</p>
    <p id="editModalName" class="muted" style="margin:0 0 14px;font-size:13px;"></p>

    <div style="display:flex;gap:10px;justify-content:flex-end;">

<script>
// ============================================================
// 🏷️ ZONE À PERSONNALISER (3/3a) : mot de passe d'accès à l'appli.
// Choisis un mot de passe différent pour chaque client.
// ============================================================
const SITE_PASSWORD = "test1234";
// Nom et initiales (2 lettres) de l'organisation : école, église, crèche, centre...
const ORG_NAME = "Test Pointage";
const ORG_INITIALS = "TP";
// ==================== FIN ZONE (3/3a) ====================

document.addEventListener('DOMContentLoaded', () => {
  document.title = ORG_NAME + ' — Feuille de présence';
  const n = document.getElementById('orgName'); if(n) n.textContent = ORG_NAME;
  const i = document.getElementById('orgInitials'); if(i) i.textContent = ORG_INITIALS;
});
function checkPassword(){
  const val = document.getElementById('passwordInput').value;
  if(val === SITE_PASSWORD){
    sessionStorage.setItem('presence_unlocked', '1');
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('heroBanner').style.display = '';
  } else {
    document.getElementById('passwordError').style.display = 'block';
  }
}
document.addEventListener('DOMContentLoaded', () => {
  const input = document.getElementById('passwordInput');
  if(input) input.addEventListener('keydown', (e) => { if(e.key === 'Enter') checkPassword(); });
  if(sessionStorage.getItem('presence_unlocked') === '1'){
    document.getElementById('lockScreen').style.display = 'none';
    document.getElementById('app').style.display = '';
    document.getElementById('heroBanner').style.display = '';
  }
});
</script>

<script>
  // ============================================================

<script>
// ============================================================
// 🏷️ ZONE À PERSONNALISER (3/3c) : numéro(s) WhatsApp qui
// recevront le récap de présence de CE client.
// Mets le 2e numéro entre les guillemets pour l'activer (sinon laisse "").
// Format : indicatif pays + numéro, sans le "+" ni espaces (ex: Côte d'Ivoire "225...").
// ============================================================
const WHATSAPP_RECAP_NUMBERS = ["", ""];
// ==================== FIN ZONE (3/3c) ====================
const DEFAULT_ROSTER = [];

function todayKey(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function fmtTime(iso){return new Date(iso).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function fmtDate(key){const [y,m,d]=key.split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

function getLocation(){
  return new Promise((resolve) => {
    if(!navigator.geolocation){ resolve(null); return; }
    navigator.geolocation.getCurrentPosition(
      (pos) => resolve({lat: pos.coords.latitude, lng: pos.coords.longitude, accuracy: Math.round(pos.coords.accuracy)}),
      () => resolve(null),
      {enableHighAccuracy:true, timeout:8000, maximumAge:60000}
    );
  });
}

let dateKey = todayKey();
document.getElementById('dateLabel').textContent = fmtDate(dateKey);

let roster = DEFAULT_ROSTER;
let rosterLoaded = false;
let checkins = {};
let groupLink = '';
let announcement = '';
let view = 'admin';
let search = '';
let showHistory = false;
let historyDates = null; // liste [{key, date, count}] une fois chargée
let historyDetail = null; // {date, list:[[name,info],...]} quand une date est ouverte

const rosterRef = db.collection('presence').doc('roster');
const settingsRef = db.collection('presence').doc('settings');
function presenceRef(key){ return db.collection('presence').doc('presence_' + key); }

// Crée le document roster avec la liste par défaut s'il n'existe pas encore
firebaseReady.then(() => {
  rosterRef.get().then(snap => {
    if(!snap.exists) rosterRef.set({members: DEFAULT_ROSTER});
  }).catch(e => showToast('Connexion à la base impossible : ' + e.message));

  rosterRef.onSnapshot(snap => {
    if(snap.exists && snap.data().members) roster = snap.data().members;
    rosterLoaded = true;
    if(pendingActions.length){
      const actions = pendingActions;
      pendingActions = [];
      actions.forEach(fn => fn());
    }
    render();
  });

  settingsRef.onSnapshot(snap => {
    groupLink = (snap.exists && snap.data().groupLink) || '';
    const input = document.getElementById('groupLinkInput');
    if(input) input.value = groupLink;

    announcement = (snap.exists && snap.data().announcement) || '';
    const annInput = document.getElementById('announceInput');
    if(annInput) annInput.value = announcement;
    renderAnnouncement();
  });

  subscribePresence(dateKey);
});

let presenceUnsub = null;
function subscribePresence(key){
  if(presenceUnsub) presenceUnsub();
  presenceUnsub = presenceRef(key).onSnapshot(snap => {
    checkins = (snap.exists && snap.data().checkins) || {};
    render();
  });
}

function openHistory(){
  showHistory = true;
  historyDetail = null;
  historyDates = null;
  render();
  firebaseReady.then(() => {
    db.collection('presence')
      .where(firebase.firestore.FieldPath.documentId(), '>=', 'presence_')
      .where(firebase.firestore.FieldPath.documentId(), '<', 'presence_\uf8ff')
      .get()
      .then(snap => {
        const rows = [];
        snap.forEach(doc => {
          const dateStr = doc.id.replace('presence_','');
          const count = Object.keys((doc.data().checkins)||{}).length;
          rows.push({key: dateStr, count});
        });
        rows.sort((a,b)=>b.key.localeCompare(a.key));
        historyDates = rows;
        render();
      })
      .catch(e => { showToast('Échec du chargement : ' + e.message); historyDates = []; render(); });
  });
}

function closeHistory(){
  showHistory = false;
  historyDetail = null;
  historyDates = null;
  render();
}

function openHistoryDate(key){
  historyDetail = {date: key, loading: true};
  render();
  firebaseReady.then(() => {
    presenceRef(key).get().then(snap => {
      const c = (snap.exists && snap.data().checkins) || {};
      const list = Object.entries(c).sort((a,b)=>new Date(a[1].time)-new Date(b[1].time));
      historyDetail = {date: key, list};
      render();
    }).catch(e => { showToast('Échec du chargement : ' + e.message); historyDetail = null; render(); });
  });
}

function backToHistoryList(){
  historyDetail = null;
  render();
}

function refreshDayIfNeeded(){
  const freshKey = todayKey();
  if(freshKey !== dateKey){
    dateKey = freshKey;
    document.getElementById('dateLabel').textContent = fmtDate(dateKey);
    firebaseReady.then(() => subscribePresence(dateKey));
  }
}
setInterval(refreshDayIfNeeded, 60000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) refreshDayIfNeeded(); });

function save(){
  firebaseReady.then(() => {
    rosterRef.set({members: roster}).catch(e => showToast('Échec de la sauvegarde : ' + e.message));
    presenceRef(dateKey).set({checkins: checkins}).catch(e => showToast('Échec de la sauvegarde : ' + e.message));
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  setTimeout(()=>t.style.display='none', 2200);
}

function setView(v){
  view = v;
  document.getElementById('tabAdmin').classList.toggle('active', v==='admin');
  document.getElementById('tabCheckin').classList.toggle('active', v==='checkin');
  render();
}

async function checkIn(name, dept){
  if(checkins[name]){ showToast(`${name} a déjà pointé — n°${checkins[name].number}`); return; }
  showToast('📍 Localisation en cours...');
  const location = await getLocation();
  if(checkins[name]) return;
  const number = Object.keys(checkins).length + 1;
  checkins[name] = {time: new Date().toISOString(), visitor:false, department:dept, number, location};
  save(); showToast(`🎉 ${name} — présence n°${number} enregistrée`); render();
}

async function addVisitor(){
  const input = document.getElementById('visitorInput');
  const name = input.value.trim();
  if(!name) return;
  if(checkins[name]){ showToast(`${name} a déjà pointé`); return; }
  showToast('📍 Localisation en cours...');
  const location = await getLocation();
  if(checkins[name]) return;
  const number = Object.keys(checkins).length + 1;
  checkins[name] = {time: new Date().toISOString(), visitor:true, department:"Visiteur", number, location};
  save(); input.value=''; showToast(`Bienvenue, ${name} ! Présence n°${number}`); render();
}

function removeCheckin(name){ delete checkins[name]; save(); render(); }

let pendingActions = [];

// Exécute l'action tout de suite si les données membres sont chargées ;
// sinon la met en attente et elle se lancera automatiquement dès que
// la connexion sera prête — jamais besoin de recliquer.
function runWhenRosterReady(action){
  if(rosterLoaded){ action(); return; }
  pendingActions.push(action);
  showToast('Connexion en cours… ce sera fait automatiquement');
  render();
}

function esc(s){ return String(s).replace(/'/g,"\\'"); }

function addMember(){
  const n = document.getElementById('newName').value.trim();
  const r = document.getElementById('newResp').value.trim();
  const p = document.getElementById('newPhone').value.trim();
  const d = document.getElementById('newDept').value.trim() || 'À définir';
  if(!n) return;

  // On capture et on vide les champs tout de suite : pas besoin de retaper,
  // même si la connexion à la base n'est pas encore prête.
  document.getElementById('newName').value='';
  document.getElementById('newResp').value='';
  document.getElementById('newPhone').value='';
  document.getElementById('newDept').value='';

  runWhenRosterReady(() => commitAddMember(n, d, p, r));
}

function commitAddMember(name, department, phone, responsibility){
  if(roster.some(m=>m.name===name)){ showToast(`${name} est déjà dans la liste`); return; }
  roster.push({name, department, phone, responsibility});
  roster.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
  save();
  showToast(`✅ ${name} a été ajouté`);
  render();
}

function removeMember(name){
  runWhenRosterReady(() => {
    roster = roster.filter(m=>m.name!==name);
    save(); render();
  });
}

function cleanPhone(p){ return (p||'').replace(/[^0-9]/g,''); }

let editModalState = null;

function editMemberField(name, field, label){
  const existing = roster.find(x=>x.name===name);
  const current = (existing && existing[field]) || '';
  editModalState = {name, field};
  document.getElementById('editModalLabel').textContent = label;
  document.getElementById('editModalName').textContent = name;
  const input = document.getElementById('editModalInput');
  input.value = current;
  document.getElementById('editModalOverlay').style.display = 'flex';
  setTimeout(()=>{ input.focus(); input.select(); }, 50);
}

function closeEditModal(){
  document.getElementById('editModalOverlay').style.display = 'none';
  editModalState = null;
}

function saveEditModal(){

function sendSmsTo(name){
  const m = roster.find(x=>x.name===name);
  const phone = (m && m.phone || '').replace(/[^0-9+]/g,'');

function bulkImportMembers(){
  const raw = document.getElementById('bulkImport').value;
  runWhenRosterReady(() => {
    const lines = raw.split('\n').map(l=>l.trim()).filter(Boolean);
    let added = 0, skipped = 0;
    lines.forEach(line => {
      const parts = line.split(',');
      const name = (parts[0] || '').trim();
      const responsibility = (parts[1] || '').trim();
      const phone = (parts[2] || '').trim();
      const dept = (parts[3] || 'À définir').trim();
      if(!name){ return; }
      if(roster.some(m=>m.name.toLowerCase()===name.toLowerCase())){ skipped++; return; }
      roster.push({name, department: dept, phone, responsibility});
      added++;
    });
    roster.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    save();
    showToast(`${added} membre(s) ajouté(s)${skipped>0?`, ${skipped} déjà présent(s) ignoré(s)`:''}`);
    render();
  });
}

// Recherche une valeur de colonne dans une ligne de tableur, quel que soit
// l'intitulé exact utilisé (accents, majuscules, variantes) parmi les
// candidats fournis.
function normalizeHeader(k){
  return String(k||'').trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
}

function pickColumn(row, candidates){
  const keys = Object.keys(row);
  for(const cand of candidates){
    const found = keys.find(k => normalizeHeader(k) === cand);
    if(found !== undefined) return String(row[found] ?? '').trim();
  }
  return '';
}

function importExcelFile(){
  const input = document.getElementById('excelFileInput');
  const file = input.files && input.files[0];
  if(!file){ showToast('Choisis d\u2019abord un fichier Excel'); return; }
  if(typeof XLSX === 'undefined'){ showToast('La librairie de lecture Excel n\u2019a pas pu se charger — vérifie ta connexion'); return; }
  const reader = new FileReader();
  reader.onload = (e) => {
    let rows;
    try{
      const data = new Uint8Array(e.target.result);
      const wb = XLSX.read(data, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      rows = XLSX.utils.sheet_to_json(ws, {defval:''});
    }catch(err){
      showToast('Impossible de lire ce fichier : ' + err.message);
      return;
    }
    input.value = '';
    importParsedRows(rows);
  };
  reader.onerror = () => showToast('Échec de la lecture du fichier');
  reader.readAsArrayBuffer(file);
}

function importParsedRows(rows){
  runWhenRosterReady(() => {
    let added = 0, skipped = 0, ignored = 0;
    rows.forEach(row => {
      const name = pickColumn(row, ['nom et prenoms','nom et prenom','nom','noms','nom complet']);
      if(!name){ ignored++; return; }
      const responsibility = pickColumn(row, ['responsabilite','role','fonction']);
      const phone = pickColumn(row, ['contact','telephone','tel','numero']);
      const department = pickColumn(row, ['direction','departement','service']) || 'À définir';
      if(roster.some(m=>m.name.toLowerCase()===name.toLowerCase())){ skipped++; return; }
      roster.push({name, department, phone, responsibility});
      added++;
    });
    roster.sort((a,b)=>a.name.localeCompare(b.name,'fr'));
    save();
    showToast(`${added} membre(s) importé(s)${skipped>0?`, ${skipped} déjà présent(s)`:''}${ignored>0?`, ${ignored} ligne(s) sans nom ignorée(s)`:''}`);
    render();
  });
}

function exportCSV(){
  const rows = [["N°","Nom","Direction","Heure","Visiteur","Latitude","Longitude"]];
  Object.entries(checkins).sort((a,b)=>new Date(a[1].time)-new Date(b[1].time))
    .forEach(([name,info])=>rows.push([info.number,name,info.department||'',fmtTime(info.time),info.visitor?'Oui':'Non',info.location?info.location.lat:'',info.location?info.location.lng:'']));
  // Point-virgule : c'est le séparateur attendu par défaut par Excel/Google Sheets
  // en français. Avec une simple virgule, ces tableurs n'arrivent pas à couper
  // les colonnes automatiquement à l'ouverture du fichier.
  const csv = rows.map(r=>r.map(c=>`"${c}"`).join(';')).join('\n');
  const blob = new Blob(["\uFEFF"+csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`presence-${dateKey}.csv`; a.click();
  URL.revokeObjectURL(url);
}

function sendRecap(numberIndex){
  const number = WHATSAPP_RECAP_NUMBERS[numberIndex];
  if(!number){ showToast('Aucun numéro configuré à cet emplacement'); return; }
  const list = Object.entries(checkins).sort((a,b)=>new Date(a[1].time)-new Date(b[1].time));
  const byDept = {};
  list.forEach(([name,info])=>{
    const d = info.department || 'Non précisé';
    (byDept[d] = byDept[d]||[]).push({name, time: fmtTime(info.time)});
  });
  let text = `*Récap présence — ${fmtDate(dateKey)}*\nTotal : ${list.length} présent(s) sur ${roster.length} membres inscrits\n\n`;
  Object.entries(byDept).forEach(([d,names])=>{
    text += `*${d}* (${names.length})\n${names.map(n=>`- ${n.name} (${n.time})`).join('\n')}\n\n`;
  });
  window.open(`https://wa.me/${number}?text=${encodeURIComponent(text.trim())}`, '_blank');
}
